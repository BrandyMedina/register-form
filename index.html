<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Registration</title>
</head>
<body>
  <main>
    <h1>Register</h1>
    <form id="registration-form" novalidate>
      <div>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" autocomplete="name" aria-invalid="false">
        <p id="name-error" class="error" role="alert" hidden></p>
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" aria-invalid="false">
        <p id="email-error" class="error" role="alert" hidden></p>
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" aria-invalid="false">
        <button type="button" data-toggle="password" aria-pressed="false">Show</button>
        <p id="password-error" class="error" role="alert" hidden></p>
      </div>
      <div>
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" aria-invalid="false">
        <button type="button" data-toggle="confirm-password" aria-pressed="false">Show</button>
        <p id="confirm-password-error" class="error" role="alert" hidden></p>
      </div>
      <button type="submit">Register</button>
    </form>
    <p id="success-message" role="status" hidden>You have been registered successfully.</p>
  </main>
  <script src="src/form.js"></script>
</body>
</html>
